<h2>6.3 自動配置から、手動で整える</h2>
<div class="cols">
<figure><img class="shot fit" src="assets/board-auto-out.png" alt="自動配置・倉庫外"><figcaption>自動配置の直後（倉庫外）</figcaption></figure>
<figure><img class="shot fit" src="assets/board-manual-out.png" alt="手動で整えた配置・倉庫外"><figcaption>手動で整えた後（倉庫外・完成図の配置）</figcaption></figure>
</div>
<div class="cols">
<figure><img class="shot fit" src="assets/board-auto-main.png" alt="自動配置・メイン"><figcaption>自動配置の直後（倉庫内メイン）</figcaption></figure>
<figure><img class="shot fit" src="assets/board-manual-main.png" alt="手動で整えた配置・メイン"><figcaption>手動で整えた後（倉庫内メイン）</figcaption></figure>
</div>
<p>この例では、自動配置の結果を次のように整えました。</p>
<div class="steps">
<p><span class="num">①</span> 製品（製品1・製品2）を倉庫外の軒下へ集めた。</p>
<p><span class="num">②</span> 軒下にあった充填品の仕掛品3 を、倉庫内のメインへ入れた（4.2 の「充填品を倉庫内へ」）。</p>
<p><span class="num">③</span> 品目の境目の列では、仕掛品2 の2ロットを1列に混載して空きを使った。</p>
</div>
<p class="muted">自動配置は出発点です。<br>最後は現場の置き方に合わせて整えます。</p>
