<h2>7.1 配置図を読む</h2>
<p>搬入日・あさ／ひる・合計パレット数、品名・ロット・パレット数、置き場所（矢印の先）を確かめます。<br>画面で読みにくければ「表示倍率」を変えます。</p>

<div>
<p><b>「5P 半」</b>は、満載5枚と端数1枚です。<br>置き場所は6枚分です。</p>
<p><b>メインのグリッドの「半」</b>は、端数のパレットを置くマスです（P13）。</p>
<p><b>「各10P」「9P/7P」</b>は、同じ品目の複数ロットを1つの欄にまとめた表記です。<br>「各」はロットそれぞれの枚数です。<br>メインに置いた荷物はまとめません。</p>
<p><b>見出しが「未定」の欄</b>は、退避スペースに残っている荷物です（P12）。</p>
