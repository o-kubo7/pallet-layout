# files/ の中身を GitHub Pages のルートとして公開する。
# リポジトリは files/index.html という構成だが、公開 URL は
# https://o-kubo7.github.io/pallet-layout/ のままにしたいので、
# "Deploy from a branch"（/ か /docs しか選べない）ではなくワークフローで配る。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らせない。実行中のデプロイは中断せず待たせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: files
      - id: deployment
        uses: actions/deploy-pages@v4
